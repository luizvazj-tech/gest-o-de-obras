<style>

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em}.r{text-align:right;font-variant-numeric:tabular-nums}tfoot td{font-weight:700}td small{display:block;color:var(--mut)}td input{width:100px;text-align:right}
a{color:var(--acc)}.neg{color:var(--bad);font-weight:600}.far{white-space:nowrap;font-size:12px;font-weight:600;color:var(--mut)}.f-v{color:var(--ok)}.f-a{color:var(--warn)}.f-r{color:var(--bad)}
.meter{display:block;position:relative;width:150px;height:10px;background:var(--line);border-radius:5px}.meter i{position:absolute;inset:0 auto 0 0;background:var(--s3);border-radius:5px}.meter b{position:absolute;top:-3px;width:2px;height:16px;background:var(--s1)}

.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-items:end;margin-bottom:10px}label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}label.wide{grid-column:1/-1}label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}textarea{width:100%}
.btn{display:inline-block;font:inherit;background:var(--acc);color:var(--on);border:1px solid var(--acc);border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;justify-self:start}.btn.sec{background:transparent;color:var(--acc)}.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}label.btn{color:var(--acc)}
.lk{background:none;border:0;color:var(--acc);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.head select{font-size:17px;font-weight:600}.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--mut);font:inherit}.tabs button.on{border-color:var(--acc);color:var(--ink);font-weight:600}
.hint,.empty{color:var(--mut);font-size:12px}.pre{white-space:pre-wrap}.warn{border:1px solid var(--bad);padding:8px;border-radius:6px}.assin{margin-top:40px;color:var(--mut)}
svg{width:100%;height:auto;max-width:900px}svg text{font-size:11px;fill:var(--mut)}.grid{stroke:var(--line)}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:14px;height:4px;margin-right:5px;vertical-align:middle}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;max-width:420px;z-index:20}#toast.show{opacity:1}#toast.bad{background:var(--bad);color:var(--surface)}
#serobox[hidden]{display:none}#serobox{margin:-60px auto 40px;max-width:1240px;border-radius:10px}main+#serobox:not([hidden]){margin-top:-56px}.gantt td,.gantt th{padding:3px 5px;text-align:center;font-size:11px;border:1px solid var(--line)}.gantt td:first-child,.gantt th:first-child{text-align:left;min-width:190px}.gantt td.g{background:color-mix(in srgb,var(--s1) 30%,transparent)}.gantt th.hoje{border-bottom:3px solid var(--acc)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:10px}.fotos figure{margin:0}.fotos img{width:100%;border-radius:6px;display:block}.fotos figcaption{font-size:12px;color:var(--mut)}

</head>

<header><h1>Gestão de Obras<small id="modo">carregando…</small></h1>
<nav><a href="#painel">Painel</a><a href="#obra">Obras</a><a href="#tarefas">Pendências</a><a href="#regularizacao">Regularização e SERO</a><a href="#relatorios">Relatórios</a><a href="#bdi">BDI</a><a href="#importar">Importar e backup</a><a href="#criterios">Critérios Caixa</a></nav>

<main id="app"><p class="empty">Carregando dados…</p></main><div id="serobox" hidden></div><template id="seroTpl"><style>
:host{display:block;color-scheme:light;--az:#0b3d91;--az2:#1d5fbf;--cz:#f1f3f6;--bd:#cfd6e0;--tx:#1b2430;--mt:#5b6778;--ok:#12703a;--er:#b3261e;--wr:#8a5a00}

.btn.dg{border-color:var(--er);color:var(--er)}.btn.sm{padding:3px 8px;font-size:12px}

main{max-width:1200px;margin:0 auto;padding:16px}

.mt{width:100%;border-collapse:collapse;font-size:13px}.mt th,.mt td{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:right}.mt th:first-child,.mt td:first-child{text-align:left}

<section class="tabpane" id="tab-vau">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =====================================================================

(function (root) {
  'use strict';

  /* ---------- utilidades ---------- */
  function r2(x) { // arredondamento comercial (meio para cima), imune a ruído binário

  }
  function r4(x) { return Math.round(parseFloat((x * 10000).toPrecision(15))) / 10000; }
  function num(v) {

  }
  var numRaw = num;

  /* ---------- tabelas fixas ---------- */
  var CATEGORIAS = { N: 'Obra Nova', A: 'Acréscimo', R: 'Reforma', D: 'Demolição' };
  var CAT_PCT = { N: 1, A: 1, R: 0.35, D: 0.10 };            // item 19.2
  var CAT_CONC = { N: 1, A: 1, R: 0.35, D: 0 };              // item 21.5
  var DESTINACOES = {
    '1': 'Residencial unifamiliar', '2': 'Residencial multifamiliar', '3': 'Comercial salas e lojas',
    '4': 'Galpão industrial', '5': 'Casa popular', '6': 'Conjunto habitacional popular', '7': 'Edifício de garagens'
  };
  var TIPOS = { A: 'Alvenaria', M: 'Mista', W: 'Madeira' };
  var TIPO_AREA_COMPL = { 'piscina': 'Piscina', 'quadra': 'Quadra esportiva/poliesportiva', 'garagem': 'Garagem/estacionamento térreo (fora da projeção)', 'posto': 'Posto de gasolina (área complementar)' };
  var ALIQ_CR = [ // item 23
    { k: 'PAT', cr: '1138-31', desc: 'CP PATRONAL - EMPREGADOS - AFERIÇÃO', a: 0.20, terc: false },
    { k: 'SEG', cr: '1082-31', desc: 'CP SEGURADOS - EMPREGADOS - AFERIÇÃO', a: 0.08, terc: false },
    { k: 'GILRAT', cr: '1646-31', desc: 'CP PATRONAL - GILRAT - AFERIÇÃO', a: 0.03, terc: false },
    { k: 'FNDE', cr: '1170-31', desc: 'CP TERCEIROS - SALÁRIO EDUCAÇÃO - AFERIÇÃO', a: 0.025, terc: true },
    { k: 'INCRA', cr: '1176-31', desc: 'CP TERCEIROS - INCRA - AFERIÇÃO', a: 0.002, terc: true },
    { k: 'SEBRAE', cr: '1200-31', desc: 'CP TERCEIROS - SEBRAE - AFERIÇÃO', a: 0.006, terc: true },
    { k: 'SESI', cr: '1184-31', desc: 'CP TERCEIROS - SESI - AFERIÇÃO', a: 0.015, terc: true },
    { k: 'SENAI', cr: '1181-31', desc: 'CP TERCEIROS - SENAI - AFERIÇÃO', a: 0.010, terc: true }
  ];
  var NP_TIPOS = { // item 34 (obra não predial)
    nf1: { rot: 'Nota fiscal/Contrato – campo 1 (materiais/equipamentos discriminados: informar só o valor do serviço)', p: 0.40 },
    nf2: { rot: 'Nota fiscal/Contrato – campo 2 (há previsão de materiais/equipamentos, valores não discriminados: valor total)', p: 0.20 },
    nf3: { rot: 'Nota fiscal/Contrato – campo 3 (sem previsão de materiais/equipamentos: valor total)', p: 0.40 },
    m_pav: { rot: 'Medição/Contrato – Pavimentação asfáltica', p: 0.04 },
    m_terr: { rot: 'Medição/Contrato – Terraplenagem, aterro sanitário ou dragagem', p: 0.06 },
    m_arte: { rot: 'Medição/Contrato – Obras de arte especiais (pontes, túneis, viadutos)', p: 0.18 },
    m_dren: { rot: 'Medição/Contrato – Drenagem', p: 0.20 },
    m_dem: { rot: 'Medição/Contrato – Demais serviços (com equipamento inerente)', p: 0.14 }
  };

  /* ---------- datas ---------- */
  function parseISO(s) { if (!s) return null; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (!m) return null; return { y: +m[1], m: +m[2], d: +m[3] }; }
  function monthsInclusive(a, b) { return (b.y - a.y) * 12 + (b.m - a.m) + 1; }
  function parseComp(s) { var m = /^(\d{1,2})\s*\/\s*(\d{4})$/.exec(String(s || '').trim()); if (!m) return null; return { m: +m[1], y: +m[2] }; }

  /* Decadência (item 20 e 20.1): competência (ano Y) é decadente quando Y <= ano da aferição - 6 */
  function decadencia(dIni, dFim, dAfer, aplicar) {
    var n = monthsInclusive(dIni, dFim);
    var dec = 0;
    if (aplicar) {
      for (var i = 0; i < n; i++) {
        var y = dIni.y + Math.floor((dIni.m - 1 + i) / 12);

    return { meses: n, decadentes: dec, naoDecadentes: nao, pDec: r4(dec / n), pNao: r4(nao / n) };
  }
  function compDecadente(c, dAfer, aplicar) { return aplicar && c && c.y <= dAfer.y - 6; }

  /* ---------- VAU / concreto usinado ---------- */
  function vauFor(dest, sim, tables) {
    var man = sim.vauManual && numRaw(sim.vauManual[dest]);
    if (man > 0) return { v: man, src: 'informado manualmente' };
    var d = parseISO(sim.datas.dataAfericao); if (!d) return { v: 0, src: 'sem data' };
    var key = d.y + '-' + (d.m < 10 ? '0' : '') + d.m, uf = sim.end.uf;
    var t = (tables.custom && tables.custom[key] && tables.custom[key][uf] && tables.custom[key][uf][dest]);
    if (t > 0) return { v: t, src: 'tabela VAU personalizada ' + key + '/' + uf };
    t = tables.vau && tables.vau[key] && tables.vau[key][uf] && tables.vau[key][uf][dest];
    if (t > 0) { var an = !!(tables.anom && tables.anom[key] && tables.anom[key].indexOf(uf) >= 0); return { v: t, src: 'tabela VAU RFB ' + key + '/' + uf, anom: an, key: key, uf: uf }; }
    return { v: 0, src: 'VAU não encontrado' };
  }
  function percEquiv(dest, areaDest) {
    switch (String(dest)) {
      case '1': return areaDest <= 1000 ? 0.89 : 0.85;
      case '2': return areaDest <= 1000 ? 0.90 : 0.86;
      case '3': case '7': return areaDest <= 3000 ? 0.86 : 0.83;
      case '4': return 0.95;
      case '5': case '6': return 0.98;
    }
    return 1;
  }
  function pctTipo(dest, tipo) { // item 19.1
    var pop = (String(dest) === '5' || String(dest) === '6');
    if (tipo === 'A') return pop ? 0.12 : 0.20;
    return pop ? 0.07 : 0.15;
  }
  function fatorSocial(areaCat) { // item 19.4
    if (areaCat <= 100) return 0.20; if (areaCat <= 200) return 0.40; if (areaCat <= 300) return 0.55; if (areaCat <= 400) return 0.70; return 0.90;
  }

  /* ---------- créditos (itens 21.1 a 21.4) ---------- */
  function processaCreditos(lista, dAfer, aplicarDec) {
    var out = [], totEmp = 0, totCI = 0, totMEI = 0, totAll = 0;
    (lista || []).forEach(function (c) {
      var comp = parseComp(c.comp), valor = num(c.valor), taxa = num(c.taxa);
      if (!comp && !valor) return;
      var atual = r2(valor * (1 + taxa / 100));
      var dec = compDecadente(comp, dAfer, aplicarDec);
      out.push({ comp: c.comp, origem: c.origem, valor: valor, taxa: taxa, atual: atual, decadente: dec });
      if (dec) return;
      totAll += atual;
      if (c.origem === 'CI') totCI += atual; else if (c.origem === 'MEI') totMEI += atual; else totEmp += atual;
    });
    return { linhas: out, totEmp: r2(totEmp), totCI: r2(totCI), totMEI: r2(totMEI), totAll: r2(totAll) };
  }

  /* ---------- débito por CR e regimes (itens 23, 26.2, 26.4, 29.2) ---------- */
  function debitos(rmtBase, cred, sim, fatorAjusteAplicado) {
    var pj = sim.resp.tipoPessoa !== 'PF', simples = sim.resp.tipoPessoa === 'PJS';
    var antes = {}, credCR = {}, apos = {}, dctf = {};
    ALIQ_CR.forEach(function (c) { antes[c.k] = r2(rmtBase * c.a); credCR[c.k] = 0; });
    var ciMei = cred.totCI + cred.totMEI;
    credCR.PAT = Math.min(r2(ciMei * 0.20), antes.PAT);
    credCR.SEG = pj ? Math.min(r2(cred.totCI * 0.11), antes.SEG) : 0;
    ALIQ_CR.forEach(function (c) { apos[c.k] = r2(antes[c.k] - credCR[c.k]); dctf[c.k] = apos[c.k]; });
    var motivos = [];
    if (simples) { ALIQ_CR.forEach(function (c) { if (c.terc) dctf[c.k] = 0; }); motivos.push('Optante pelo Simples Nacional: contribuições a terceiros dispensadas (item 26.4).'); }
    if (sim.opts.desoneracao) { dctf.PAT = 0; motivos.push('Desoneração da folha (CPRB): contribuição patronal de 20% não é incluída na DCTFWeb (item 26.4).'); }
    var zera = false;
    if (pj && sim.opts.contabilidade === 'declaracao') { zera = true; motivos.push('Aferição por declaração de contabilidade regular: DCTFWeb gerada com valores zerados (item 26.2.1).'); }
    if (pj && sim.opts.semMO) { zera = true; motivos.push('Obra sem mão de obra remunerada (PJ com contabilidade regular): DCTFWeb zerada (item 26.2.1.1).'); }
    if (!pj && sim.opts.casaPopularFin) { zera = true; motivos.push('Casa popular com recursos do sistema financeiro e sem mão de obra remunerada: DCTFWeb sem débito (item 29.2).'); }
    if (fatorAjusteAplicado) { zera = true; motivos.push('Fator de ajuste aplicado: DCTFWeb transmitida sem débitos (item 22).'); }
    var tot = 0;
    ALIQ_CR.forEach(function (c) { if (zera) dctf[c.k] = 0; tot += dctf[c.k]; });
    return { antes: antes, credCR: credCR, apos: apos, dctf: dctf, total: r2(tot), motivos: motivos, zerada: zera };
  }

  /* ======================= OBRA PREDIAL ======================= */
  function calcPredial(sim, tables) {
    var R = { tipo: 'predial', erros: [], avisos: [] };
    var dIni = parseISO(sim.datas.inicioObra), dFim = parseISO(sim.datas.fimPeriodo), dAf = parseISO(sim.datas.dataAfericao);
    if (!dIni || !dFim || !dAf) { R.erros.push('Informe as datas de início da obra, fim do período de aferição e da aferição.'); return R; }
    if (monthsInclusive(dIni, dFim) < 1) { R.erros.push('A data de fim do período de aferição é anterior ao início da obra.'); return R; }
    var aplicarDec = sim.opts.aplicarDecadencia !== false;
    var pf = sim.resp.tipoPessoa === 'PF';
    R.dec = decadencia(dIni, dFim, dAf, aplicarDec);
    R.competencia = (dAf.m < 10 ? '0' : '') + dAf.m + '/' + dAf.y;

    var P = (sim.principais || []).map(function (p, i) { return { i: i, cat: p.cat, dest: String(p.dest), tipo: p.tipo, area: num(p.area) }; }).filter(function (p) { return p.area > 0; });
    var C = (sim.complementares || []).map(function (c, i) { return { i: i, cat: c.cat, dest: String(c.dest), tipo: c.tipo, tipoArea: c.tipoArea, cob: num(c.coberta), desc: num(c.descoberta) }; }).filter(function (c) { return c.cob + c.desc > 0; });
    if (!P.length) { R.erros.push('Informe ao menos uma área principal.'); return R; }

    // equivalência por destinação (item 17.1)
    var somaDest = {}; P.forEach(function (p) { somaDest[p.dest] = (somaDest[p.dest] || 0) + p.area; });
    var vauUsados = {};
    function getVau(dest) { if (!vauUsados[dest]) vauUsados[dest] = vauFor(dest, sim, tables); return vauUsados[dest].v; }

    var linhas = []; // todas as áreas que geram custo
    P.forEach(function (p) {
      var pe = percEquiv(p.dest, somaDest[p.dest]);
      var areaCalc = r2(p.area * pe), vau = getVau(p.dest);
      linhas.push({ id: 'P' + p.i, kind: 'P', rot: 'Principal', cat: p.cat, dest: p.dest, tipo: p.tipo, area: p.area, pe: pe, areaCalc: areaCalc, vau: vau, cod: r2(areaCalc * vau) });
    });
    R.reducoes = { descoberta: 0.25, coberta: 0.50 };
    C.forEach(function (c) {
      var aD = r2(c.desc * 0.25), aC = r2(c.cob * 0.50), vau = getVau(c.dest), areaCalc = r2(aD + aC);
      linhas.push({ id: 'C' + c.i, kind: 'C', rot: TIPO_AREA_COMPL[c.tipoArea] || 'Complementar', cat: c.cat, dest: c.dest, tipo: c.tipo, area: c.cob + c.desc, cob: c.cob, desc: c.desc, aCobCalc: aC, aDescCalc: aD, areaCalc: areaCalc, vau: vau, cod: r2(areaCalc * vau) });
    });
    Object.keys(vauUsados).forEach(function (d) { if (!(vauUsados[d].v > 0)) R.erros.push('VAU não encontrado para "' + DESTINACOES[d] + '" (' + sim.end.uf + ', competência ' + R.competencia + '). Informe o VAU manualmente (consulte a Tabela VAU no Sero) ou cadastre em "Tabela VAU".'); });
    if (R.erros.length) { R.vauInfo = vauUsados; return R; }
    R.vauInfo = vauUsados;
    Object.keys(vauUsados).forEach(function (d) { if (vauUsados[d].anom) { var msg = 'Atenção: na fonte (e-CAC/Sero), o VAU de ' + vauUsados[d].key + ' para ' + vauUsados[d].uf + ' repete valores de outra UF e está marcado como divergente. Confira no Sero antes de usar este resultado.'; if (R.avisos.indexOf(msg) < 0) R.avisos.push(msg); } });

    // fator social por categoria (item 19.4) – soma das áreas (principais + complementares) da categoria
    var areaCat = {};
    linhas.forEach(function (l) { areaCat[l.cat] = (areaCat[l.cat] || 0) + l.area; });
    R.areaCat = areaCat;

    // pré-moldados / pré-fabricados (item 19.5)
    var nfLinhas = {}; var nfs = [];
    (sim.nfs || []).forEach(function (nf) {
      var v = num(nf.valor), t = num(nf.taxa), at = r2(v * (1 + t / 100)), par = num(nf.parcela) / 100;
      if (!v) return;
      nfs.push({ numero: nf.numero, emissor: nf.emissor, data: nf.data, valor: v, taxa: t, atual: at, linha: nf.linha, parcela: par * 100 });
      if (nf.linha) nfLinhas[nf.linha] = (nfLinhas[nf.linha] || 0) + at * par;
    });
    R.nfs = nfs; R.avalNF = [];
    var tot = 0;
    linhas.forEach(function (l) {
      l.tipoCalc = l.tipo; l.nfPct = 1; l.pTipo = pctTipo(l.dest, l.tipo);
      if (l.tipo === 'A' && nfLinhas[l.id] > 0) {
        var custoNF = r2(nfLinhas[l.id]), rel = custoNF / l.cod;
        var ok = r2(nfLinhas[l.id]) >= l.cod * 0.40 - 1e-9;
        R.avalNF.push({ linha: l, custoNF: custoNF, rel: rel, ok: ok });
        if (ok) { l.nfPct = 0.30; } else { l.tipoCalc = 'M'; l.pTipo = pctTipo(l.dest, 'M'); }
      }
      l.pCat = CAT_PCT[l.cat]; l.pDest = (l.dest === '7') ? 0.80 : 1;
      l.fs = pf ? fatorSocial(areaCat[l.cat]) : 1;
      l.rmt = r2(l.cod * l.pTipo * l.pCat * l.pDest * l.nfPct * l.fs);
      tot += l.rmt;
    });
    R.linhas = linhas;
    R.rmtTotal = r2(tot);
    R.rmtDec = r2(R.rmtTotal * R.dec.pDec);
    R.rmtNao = r2(R.rmtTotal * R.dec.pNao);

    // créditos por concreto usinado (item 21.5)
    R.concreto = { usou: !!sim.opts.concreto, linhas: [], total: 0 };
    if (sim.opts.concreto) {
      var tabC = tables.conc && tables.conc[sim.end.uf];
      linhas.forEach(function (l) {
        var up = tabC ? tabC[l.dest] : 0; if (!tabC) R.avisos.push('Percentual de uso de concreto usinado não encontrado para a UF.');
        var ap = CAT_CONC[l.cat], cred = r2(l.cod * up * ap * 0.05 * R.dec.pNao);
        R.concreto.linhas.push({ l: l, up: up, ap: ap, ajuste: 0.05, cred: cred });
        R.concreto.total += cred;
      });
      R.concreto.total = r2(R.concreto.total);
    }

    // créditos de remuneração
    R.cred = processaCreditos(sim.creditos, dAf, aplicarDec);
    var abateRMT = r2(R.cred.totEmp); // CI e MEI não abatem a RMT: abatem o débito por CR
    R.rmtFinal = r2(Math.max(0, R.rmtAposConc - abateRMT));

    // fator de ajuste (item 22) – somente obra predial de pessoa física
    var areaTotal = 0; linhas.forEach(function (l) { areaTotal += l.area; });
    R.areaProjeto = areaTotal;
    R.fa = { aplicavel: pf, min: areaTotal > 350 ? 0.70 : 0.50, entrega: !!sim.opts.entregaDCTF, pct: R.rmtNao > 0 ? R.cred.totAll / R.rmtNao : 0, aplicado: false, motivo: '' };
    if (pf) {

      R.fa.aplicado = okPct && okEnt;

    }
    R.deb = debitos(R.rmtFinal, R.cred, sim, R.fa.aplicado);
    return R;
  }

  /* ======================= OBRA NÃO PREDIAL ======================= */
  function calcNaoPredial(sim, tables) {
    var R = { tipo: 'naopredial', erros: [], avisos: [] };
    var dIni = parseISO(sim.datas.inicioObra), dFim = parseISO(sim.datas.fimPeriodo), dAf = parseISO(sim.datas.dataAfericao);
    if (!dIni || !dFim || !dAf) { R.erros.push('Informe as datas de início da obra, fim do período de aferição e da aferição.'); return R; }
    if (monthsInclusive(dIni, dFim) < 1) { R.erros.push('A data de fim do período de aferição é anterior ao início da obra.'); return R; }
    var aplicarDec = sim.opts.aplicarDecadencia !== false;
    R.dec = decadencia(dIni, dFim, dAf, aplicarDec);
    R.competencia = (dAf.m < 10 ? '0' : '') + dAf.m + '/' + dAf.y;
    var g = [], tot = 0, equip = false;
    ((sim.np && sim.np.gastos) || []).forEach(function (x) {
      var v = num(x.valor); if (!v) return;
      var t = num(x.taxa), at = r2(v * (1 + t / 100)), cfg = NP_TIPOS[x.tipo] || NP_TIPOS.nf3;
      var rmt = r2(at * cfg.p);
      g.push({ doc: x.doc, emissor: x.emissor, data: x.data, tipo: x.tipo, rot: cfg.rot, valor: v, taxa: t, atual: at, p: cfg.p, rmt: rmt });
      tot += rmt; if (x.tipo.indexOf('m_') === 0) equip = true;
    });
    if (!g.length) { R.erros.push('Lance ao menos um gasto (nota fiscal ou medição).'); return R; }
    if (g.some(function (x) { return x.tipo === 'nf1'; }) && equip) R.avisos.push('Há serviços com equipamento inerente (Medição/Contrato) e serviços lançados no campo 1: a RMT do campo 1 não pode ser inferior à calculada pelos percentuais mínimos da Medição/Contrato (item 34.1 e 34.2). Confira no Sero.');
    R.gastos = g; R.rmtTotal = r2(tot);
    R.rmtDec = r2(R.rmtTotal * R.dec.pDec); R.rmtNao = r2(R.rmtTotal * R.dec.pNao);
    R.cred = processaCreditos(sim.creditos, dAf, aplicarDec);
    R.rmtFinal = r2(Math.max(0, R.rmtNao - R.cred.totEmp));
    R.fa = { aplicavel: false };
    R.deb = debitos(R.rmtFinal, R.cred, sim, false);
    return R;
  }

  if(di){ var a=E.parseISO(S.datas.inicioObra),b=E.parseISO(S.datas.fimPeriodo),c=E.parseISO(S.datas.dataAfericao);

  var vb=D.getElementById('vau-box');
  if(vb&&S.mode==='predial'){ var ds={}; S.principais.forEach(function(p){ ds[p.dest]=1; }); S.complementares.forEach(function(c){ ds[c.dest]=1; });
    var h='<div class="grid">'; Object.keys(ds).forEach(function(d){ var vv=E.vauFor(d,S,tables); h+='<label class="f"><span>'+esc(DESTM[d])+' – tabela: <b>'+(tabVau(d)>0?n2(tabVau(d)):'não encontrado')+'</b></span><input type="text" data-p="vauManual.'+d+'" value="'+esc(S.vauManual[d]||'')+'" placeholder="usar tabela"></label>'; });
    h+='</div>'; if(!vb.dataset.sig||vb.dataset.sig!==Object.keys(ds).join(',')+S.end.uf+S.datas.dataAfericao){ vb.innerHTML=h; vb.dataset.sig=Object.keys(ds).join(',')+S.end.uf+S.datas.dataAfericao; } }
  // créditos / NF / gastos – colunas calculadas
  var ad=E.parseISO(S.datas.dataAfericao), aplic=S.opts.aplicarDecadencia!==false;
  S.creditos.forEach(function(c,i){ var at=E.r2(E.num(c.valor)*(1+E.num(c.taxa)/100)); var el=D.getElementById('cat-'+i); if(el) el.textContent=brl(at); var cs=D.getElementById('csit-'+i); var cp=E.parseComp(c.comp); if(cs) cs.textContent=(cp&&ad&&aplic&&cp.y<=ad.y-6)?'Decadente – não utilizado':(cp?'Utilizável':'Competência inválida'); });
  S.nfs.forEach(function(n,i){ var el=D.getElementById('nat-'+i); if(el) el.textContent=brl(E.r2(E.num(n.valor)*(1+E.num(n.taxa)/100))); });
  if(S.mode==='naopredial') S.np.gastos.forEach(function(g,i){ var cfg=E.NP_TIPOS[g.tipo]||E.NP_TIPOS.nf3; var at=E.r2(E.num(g.valor)*(1+E.num(g.taxa)/100)); var a1=D.getElementById('gat-'+i), a2=D.getElementById('grm-'+i); if(a1) a1.textContent=brl(at); if(a2) a2.textContent=brl(E.r2(at*cfg.p)); });
  renderSummary();
  if(curTab==='rel') renderReport();
}

/* ---------- abas ---------- */
function goTab(t){
  curTab=t; ['vau','sim','rel','salvas','cad','ajuda'].forEach(function(k){ D.getElementById('tab-'+k).classList.toggle('hid',k!==t); });
  Array.prototype.forEach.call(D.querySelectorAll('#tabs button'),function(b){ b.classList.toggle('on',b.dataset.t===t); });
  if(t==='rel'){ R=E.calcular(S,tables); renderReport(); }
  if(t==='salvas') renderSaved();
  if(t==='cad'){ renderVauTab(); }
  if(t==='vau'){ renderConsulta(); }
  if(t==='sim'){ renderForm(); update(); }
  window.scrollTo(0,0);
}
D.getElementById('tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) goTab(b.dataset.t); });
function toast(m){ var t=D.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },3200); }

/* ---------- persistência das simulações ---------- */
function listSims(){ try{ return JSON.parse(lsGet(STORE_KEY)||'[]')||[]; }catch(e){ return []; } }
function writeSims(a){ lsSet(STORE_KEY,JSON.stringify(a)); }
function saveSim(){
  if(!S.nome||!S.nome.trim()){ S.nome='Simulação '+new Date().toLocaleString('pt-BR'); renderForm(); update(); }
  var a=listSims(), snap=JSON.parse(JSON.stringify(S)); snap.savedAt=new Date().toISOString();
  var i=a.findIndex(function(x){ return x.id===S.id; }); if(i>=0) a[i]=snap; else a.unshift(snap);
  writeSims(a); toast(storeOK?'Simulação salva: '+S.nome:'Armazenamento do navegador indisponível – use “Exportar” para guardar o arquivo.');
}
function renderSaved(){
  var a=listSims(), h='';
  if(!a.length) h='<p class="note">Nenhuma simulação salva ainda.</p>';
  else h='<table class="sl"><tr><th>Nome</th><th>Tipo</th><th>Responsável / UF</th><th>Salva em</th><th></th></tr>'+a.map(function(x){ return '<tr><td><b>'+esc(x.nome||'(sem nome)')+'</b></td><td>'+(x.mode==='naopredial'?'Não predial':'Predial')+'</td><td>'+esc(x.resp&&x.resp.nome||'---')+' · '+esc(x.end&&x.end.uf||'')+'</td><td>'+(x.savedAt?new Date(x.savedAt).toLocaleString('pt-BR'):'')+'</td><td><button class="btn sm pri" data-open="'+x.id+'">Abrir</button> <button class="btn sm" data-dup="'+x.id+'">Duplicar</button> <button class="btn sm" data-expsim="'+x.id+'">Exportar</button> <button class="btn sm dg" data-delsim="'+x.id+'" data-arm="0">Excluir</button></td></tr>'; }).join('')+'</table>';
  D.getElementById('lista-salvas').innerHTML=h;
  D.getElementById('lista-ex').innerHTML='<table class="sl">'+EXEMPLOS_SRC.map(function(x,i){ return '<tr><td><b>'+esc(x.titulo)+'</b><div class="note">'+esc(x.esperado)+'</div></td><td><button class="btn sm pri" data-ex="'+i+'">Carregar</button></td></tr>'; }).join('')+'</table>';
}
function openSim(id){ var x=listSims().find(function(s){ return s.id===id; }); if(!x) return; S=JSON.parse(JSON.stringify(x)); delete S.savedAt; goTab('sim'); renderForm(); update(); toast('Simulação aberta'); }
function dupSim(id){ var a=listSims(), x=a.find(function(s){ return s.id===id; }); if(!x) return; var c=JSON.parse(JSON.stringify(x)); c.id=uid(); c.nome=(x.nome||'Simulação')+' (cópia)'; c.savedAt=new Date().toISOString(); a.unshift(c); writeSims(a); renderSaved(); toast('Simulação duplicada'); }
function delSim(id){ writeSims(listSims().filter(function(s){ return s.id!==id; })); renderSaved(); toast('Simulação excluída'); }
function download(name,txt,type){ HOST.baixar(name,txt); }
function exportSims(ids){ var a=listSims(); if(ids) a=a.filter(function(s){ return ids.indexOf(s.id)>=0; }); download('simulacoes-sero.json',JSON.stringify({tipo:'sero-simulacoes',versao:1,itens:a},null,1)); }
D.getElementById('b-exp-todas').onclick=function(){ exportSims(null); };
D.getElementById('f-imp').addEventListener('change',function(e){ var f=e.target.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ try{ var j=JSON.parse(rd.result), it=j.itens||(Array.isArray(j)?j:[j]); var a=listSims(); it.forEach(function(x){ if(x&&x.mode){ x.id=uid(); x.savedAt=new Date().toISOString(); a.unshift(x); } }); writeSims(a); renderSaved(); toast(it.length+' simulação(ões) importada(s)'); }catch(err){ toast('Arquivo inválido'); } }; rd.readAsText(f); e.target.value=''; });

/* ---------- exemplos ---------- */
function loadExample(i){ var x=EXEMPLOS_SRC[i]; var s=newSim(x.sim.mode); S=Object.assign(s,JSON.parse(JSON.stringify(x.sim))); S.id=uid(); S.nome=x.titulo; goTab('sim'); renderForm(); update(); toast('Exemplo carregado: confira com o esperado'); }

function renderVauCob(){
  var todas=UFS.slice(), ms=Object.keys(tables.vau).sort(), grupos=[], ult=null;

function drawChart(ms,ser){

  g+='<line id="c-vl" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="#999" stroke-dasharray="3" style="display:none"/>';
  var el=D.getElementById('c-chart'); el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Evolução do VAU">'+g+'<rect x="'+L+'" y="'+T+'" width="'+(W-L-Rr)+'" height="'+(H-T-B)+'" fill="transparent" id="c-hit"/></svg>';

    tip.innerHTML='<b>'+mlabel(ms[i])+'</b><br>'+draw.map(function(s,si){ var v=vget(ms[i],s.uf,s.d); return '<span style="color:'+['#9ec1ff','#ffb48a','#8fd9a0','#d9a6ec','#f4a3c1','#8ad8e6','#ffd27a','#c9d0d8','#bde28a','#9cc9f5'][si%10]+'">■</span> '+esc(s.nome)+': '+(v?brl(v):'—'); }).join('<br>'); tip.style.display='block';
    var pr=el.getBoundingClientRect(); tip.style.left=Math.min(e.clientX-pr.left+14,pr.width-190)+'px'; tip.style.top=(e.clientY-pr.top+10)+'px'; });

<script>
/* ===== núcleo: utilidades, armazenamento e cálculos (sem DOM) ===== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').trim().replace(/[R$\s%]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const money=v=>v==null?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const moneyK=v=>v==null?'—':Math.abs(v)>=1e6?'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi':Math.abs(v)>=1e3?'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':money(v);
const pct=(v,d=2)=>v==null?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const qt=v=>v==null?'—':v.toLocaleString('pt-BR',{maximumFractionDigits:2});
const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const pd=s=>new Date(s+'T12:00:00');
const br=s=>!s?'—':/^\d{4}-\d{2}$/.test(s)?s.slice(5)+'/'+s.slice(0,4):s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const days=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const weekOf=s=>{const d=pd(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const w=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-w);const y=t.getUTCFullYear();return y+'-S'+String(Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)).padStart(2,'0')};
const weekRange=w=>{const [y,n]=w.split('-S').map(Number);const j=new Date(y,0,4,12);const m=new Date(j);m.setDate(j.getDate()-((j.getDay()||7)-1)+(n-1)*7);const a=iso(m);return [a,addDays(a,6)]};
const monthEnd=m=>{const [y,n]=m.split('-').map(Number);return iso(new Date(y,n,0,12))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* armazenamento: banco do artefato; fora dele, navegador (ou memória) */
const Store={db:null,idb:null,mem:{},queue:Promise.resolve(),readonly:false,mode:'memória',
 async init(){try{if(window.claude&&claude.use){this.db=await claude.use('db')}}catch(e){this.db=null}
  if(this.db){this.mode='nuvem';try{const u=await claude.use('user');if(u&&(await u.can('data.write'))===false)this.readonly=true}catch(e){}}
  else{try{this.idb=await new Promise((ok,no)=>{const r=indexedDB.open('sistema-gestao-obras',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
    await new Promise((ok,no)=>{const c=this.idb.transaction('docs').objectStore('docs').openCursor();c.onsuccess=()=>{const x=c.result;if(!x)return ok();this.mem[x.key]=x.value;x.continue()};c.onerror=()=>no(c.error)});
    this.mode='navegador';try{navigator.storage?.persist?.()}catch(e){}}catch(e){this.idb=null;this.mode='memória'}}},
 async retry(fn){for(let t=0;;t++){try{return await fn()}catch(e){if(t>=4||!['resource_exhausted','unavailable'].includes(e&&e.code))throw e;await new Promise(r=>setTimeout(r,600*2**t+Math.random()*300))}}},
 persist(p){if(this.db||!this.idb)return;return new Promise((ok,no)=>{const t=this.idb.transaction('docs','readwrite'),s=t.objectStore('docs');p in this.mem?s.put(this.mem[p],p):s.delete(p);t.oncomplete=()=>ok();t.onabort=()=>no(new Error('o navegador não gravou os dados (espaço insuficiente ou bloqueio). Baixe um backup.'))})},
 async get(p){if(this.db){const s=await this.retry(()=>this.db.doc(p).get());return s.exists?JSON.parse(JSON.stringify(s.data())):null}return this.mem[p]?JSON.parse(JSON.stringify(this.mem[p])):null},
 async list(c){if(this.db){const out=[];const q=await this.retry(()=>this.db.collection(c).limit(1000).get());q.docs.forEach(d=>out.push({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));return out}
  const n=c.split('/').length+1;return Object.keys(this.mem).filter(k=>k.startsWith(c+'/')&&k.split('/').length===n).sort().map(k=>({id:k.split('/').pop(),...JSON.parse(JSON.stringify(this.mem[k]))}))},
 write(fn){const r=this.queue.then(fn);this.queue=r.catch(()=>{});return r},
 set(p,d){const c=JSON.parse(JSON.stringify(d));delete c.id;return this.write(async()=>{if(this.db)await this.retry(()=>this.db.doc(p).set(c));else{this.mem[p]=c;await this.persist(p)}})},
 del(p){return this.write(async()=>{if(this.db)await this.db.doc(p).delete();else{delete this.mem[p];await this.persist(p)}})}
};

/* estado em memória */
const S={obras:[],ref:today(),sel:null};
const SUBS=['semanas','diario','medicoes','pedidos','cotacoes','lanc'];
const blank=()=>({nome:'',municipio:'',construtora:'',rt:'',produto:'Apoio à Produção',bdi:0,valorTotal:0,financiamento:0,retencao:5,inicio:'',fim:'',unidades:0,vendidas:0,concluida:false,habitese:false,tolAmarelo:0.95,tolVermelho:0.85,
 baseline:{},custoMensal:{},grupos:[],insumos:[],vencimentos:[],pendencias:[],tarifas:[],auditoria:[],
 contrat:{contratada:false,linhaBase:'',previsto:'',data:'',obs:''},pnvDefasagem:null,realizadoTexto:'',proximosTexto:'',cronoGrupos:{},reg:{},trimestrais:[]});
async function loadObra(id,meta){const o={...blank(),...meta,id};const it=await Store.get(`obras/${id}/dados/itens`);o.itens=it?it.itens:[];
 for(const c of SUBS)o[c]=await Store.list(`obras/${id}/${c}`);return o}
async function loadAll(){const metas=await Store.list('obras');const out=[];for(let i=0;i<metas.length;i+=4)out.push(...await Promise.all(metas.slice(i,i+4).map(m=>loadObra(m.id,m))));
 S.obras=out.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));if(!S.obras.find(o=>o.id===S.sel))S.sel=S.obras[0]?.id||null}
function metaOf(o){const m={...o};delete m.id;delete m.itens;SUBS.forEach(c=>delete m[c]);return m}
const saveMeta=o=>Store.set(`obras/${o.id}`,metaOf(o));
const saveItens=o=>Store.set(`obras/${o.id}/dados/itens`,{itens:o.itens});
async function saveSub(o,c,id,d){await Store.set(`obras/${o.id}/${c}/${id}`,d);const i=o[c].findIndex(x=>x.id===id);const r={...d,id};i<0?o[c].push(r):o[c][i]=r;o[c].sort((a,b)=>a.id<b.id?-1:1)}
async function delSub(o,c,id){await Store.del(`obras/${o.id}/${c}/${id}`);o[c]=o[c].filter(x=>x.id!==id)}

/* item: {c:código,d:descrição,g:nº do grupo,v:custo direto,r:custo realizado importado,p:% físico inicial,dp:data do % inicial} */
const direto=o=>o.itens.reduce((s,i)=>s+i.v,0);
const total=o=>o.valorTotal>0?o.valorTotal:direto(o)*(1+(o.bdi||0)/100);
/* % físico por item até a data: última apuração semanal <= data */
function fisItens(o,ref){const m={};let any=false;o.itens.forEach(i=>{if(i.p!=null&&(!i.dp||i.dp<=ref)){m[i.c]=i.p;any=true}});
 o.semanas.filter(s=>s.fim<=ref||s.inicio<=ref).forEach(s=>{for(const[k,v]of Object.entries(s.fis||{})){m[k]=v;any=true}});return{m,any}}
function fisico(o,ref,g){const{m,any}=fisItens(o,ref);let a=0,b=0;o.itens.forEach(i=>{if(g!=null&&i.g!==g)return;b+=i.v;a+=i.v*(m[i.c]||0)/100});return any&&b?a/b*100:null}
/* previsto: interpolação linear entre marcos mensais (fim de mês) da linha de base */
function previsto(o,ref){const k=Object.keys(o.baseline||{}).sort();if(!k.length)return null;
 const pts=k.map(m=>[monthEnd(m),o.baseline[m]]);const first=addDays(k[0]+'-01',-1);pts.unshift([first,0]);
 if(ref<=pts[0][0])return 0;for(let i=1;i<pts.length;i++){if(ref<=pts[i][0]){const[a,x]=pts[i-1],[b,y]=pts[i];return x+(y-x)*days(a,ref)/Math.max(1,days(a,b))}}return pts.at(-1)[1]}
function pedidoValor(p){return (p.qtd||0)*(p.unit||0)}
function custoReal(o,ref){const imp=Object.entries(o.custoMensal||{}).filter(([m])=>m<=ref.slice(0,7)).reduce((s,[,v])=>s+v,0);
 return imp+o.pedidos.filter(p=>p.status==='Recebido'&&p.recebido&&p.recebido<=ref).reduce((s,p)=>s+pedidoValor(p),0)}
const comprometido=(o,ref)=>o.pedidos.filter(p=>['Pedido emitido'].includes(p.status)&&(!p.data||p.data<=ref)).reduce((s,p)=>s+pedidoValor(p),0);
function monthsDiff(a,b){return (pd(b)-pd(a))/864e5/30.4375}
function farolContrat(o,ref){const c=o.contrat||{};if(!c.linhaBase)return null;const alvo=c.contratada&&c.data?c.data:(c.previsto&&c.previsto>ref?c.previsto:ref);const m=monthsDiff(c.linhaBase,alvo);return{cor:m<=0?'v':m<=3?'a':'r',meses:m}}
function farolObra(o,ref){const f=fisico(o,ref),p=previsto(o,ref);if(f==null||p==null||p<=0)return null;const i=f/p;return{cor:i>=o.tolAmarelo?'v':i>=o.tolVermelho?'a':'r',idp:i}}
function farolPNV(o){const m=o.pnvDefasagem;if(m==null||m==='')return null;return{cor:m<=0?'v':m<4?'a':'r'}}
function farolGeral(o,ref){const f=o.contrat?.contratada?[farolObra(o,ref),farolPNV(o)]:[farolContrat(o,ref)];const c=f.filter(Boolean).map(x=>x.cor);return c.includes('r')?'r':c.includes('a')?'a':c.length?'v':null}
/* consumíveis */
function movInsumo(o,ins,a,b){let ent=0,sai=0;o.semanas.forEach(s=>{if(s.inicio>=a&&s.inicio<=b){const x=(s.consumo||{})[ins.id];if(x){ent+=x.ent||0;sai+=x.sai||0}}});
 o.pedidos.forEach(p=>{if(p.insumo===ins.id&&p.status==='Recebido'&&p.recebido>=a&&p.recebido<=b)ent+=p.qtd||0});return{ent,sai}}
function estoque(o,ins,ref){const t=movInsumo(o,ins,'0000-00-00',ref);const saldo=(ins.estIni||0)+t.ent-t.sai;
 const ult=o.semanas.filter(s=>s.inicio<=ref&&s.inicio>addDays(ref,-28));const media=ult.length?ult.reduce((x,s)=>x+((s.consumo||{})[ins.id]?.sai||0),0)/ult.length:0;
 const cobertura=media>0?saldo/media:null;const consPct=ins.prevTotal>0?t.sai/ins.prevTotal*100:null;
 const situ=saldo<0?'Saldo negativo':saldo<(ins.min||0)?'Abaixo do mínimo':cobertura!=null&&cobertura<2?'Cobertura < 2 semanas':'Regular';
 return{...t,saldo,media,cobertura,consPct,situ}}
/* medição */
function medicao(o,mes){const fim=monthEnd(mes),ant=addDays(mes+'-01',-1);const a=fisico(o,fim)??0,p=fisico(o,ant)??0,pv=previsto(o,fim);
 const teto=o.concluida&&o.habitese?100:100-(o.retencao||0);
 const base=Math.min(a,pv==null?a:pv,teto);const liberavel=(o.financiamento||0)*base/100;
 const lib=o.medicoes.filter(x=>x.id<mes).reduce((s,x)=>s+(x.liberado||0),0);
 return{mes,fim,acum:a,ant:p,delta:a-p,prev:pv,valorMes:total(o)*(a-p)/100,valorAcum:total(o)*a/100,base,teto,liberavel,jaLiberado:lib,aLiberar:Math.max(0,liberavel-lib)}}
function alertas(o,ref){const al=[];const add=(n,t)=>al.push({n,t,obra:o.nome,id:o.id});
 o.vencimentos.forEach(v=>{if(!v.vence)return;const d=days(ref,v.vence);if(d<0)add('r',`${v.tipo}: vencida em ${br(v.vence)}`);else if(d<=60)add('a',`${v.tipo}: vence em ${d} dias (${br(v.vence)})`)});
 o.pendencias.filter(p=>p.status!=='Concluída'&&p.prazo&&p.prazo<ref).forEach(p=>add('r',`Pendência atrasada: ${p.desc} (prazo ${br(p.prazo)})`));
 o.insumos.forEach(i=>{const e=estoque(o,i,ref);if(e.situ!=='Regular')add(e.situ==='Cobertura < 2 semanas'?'a':'r',`${i.nome}: ${e.situ.toLowerCase()} (saldo ${qt(e.saldo)} ${i.un})`)});
 const over=o.itens.filter(i=>(i.r||0)>i.v+0.01);if(over.length)add('r',`${over.length} serviço(s) com custo realizado acima do orçado (excesso ${money(over.reduce((s,i)=>s+i.r-i.v,0))})`);
 const f=farolObra(o,ref);if(f&&f.cor!=='v')add(f.cor,`Atraso físico: IDP ${f.idp.toFixed(2).replace('.',',')}`);
 const fc=!o.contrat.contratada&&farolContrat(o,ref);if(fc&&fc.cor!=='v')add(fc.cor,`Contratação atrasada ${fc.meses.toFixed(1).replace('.',',')} meses ante a linha de base`);
 if(o.contrat.contratada&&!o.concluida&&!o.semanas.some(s=>s.inicio>=addDays(ref,-13)&&s.inicio<=ref))add('a','Sem apontamento semanal nos últimos 14 dias');
 if(!Object.keys(o.baseline).length)add('a','Sem cronograma de linha de base: previsto e IDP não calculados');
 alertasExtra(o,ref,add);return al}

/* ===== importação da PLS ===== */
function parsePLS(wb,X){let best=null;
 for(const name of wb.SheetNames){const ws=wb.Sheets[name];if(!ws['!ref'])continue;const rg=X.utils.decode_range(ws['!ref']);
  const cell=(r,c)=>ws[X.utils.encode_cell({r,c})],val=(r,c)=>cell(r,c)?.v;
  let head=-1;for(let r=0;r<Math.min(60,rg.e.r);r++){if(/n[ºo°]\s*do item/i.test(String(val(r,1)??''))){head=r;break}}if(head<0)continue;
  let mrow=-1,months=[];for(let r=head;r<head+6;r++){const m=[];for(let c=6;c<=rg.e.c;c++){const v=val(r,c);let d=null;if(v instanceof Date)d=v;else if(typeof v==='number'&&v>36000&&v<60000)d=new Date(Math.round((v-25569)*864e5));if(d)m.push([c,new Date(d.getTime()+432e5).toISOString().slice(0,7)])}if(m.length>=3){mrow=r;months=m;break}}
  const itens=[],grupos=[],custo={},audit=[];let g=0,end=rg.e.r,totalBDI=0;
  for(let r=head+1;r<=rg.e.r;r++){const b=val(r,1),c=val(r,2),d=val(r,3),e=val(r,4);
   if(typeof b==='string'&&/valor total de constru/i.test(b)){totalBDI=num(e);continue}
   if(typeof b==='string'&&/custo direto de constru/i.test(b)){end=r;continue}
   if(r>=end)continue;
   if(b!=null&&/^\d{1,2}$/.test(String(b).trim())&&d){g=+b;grupos.push({n:g,nome:String(d).trim()});continue}
   if(c!=null&&String(c).trim()&&typeof e==='number'){let r_=0;for(const[col,m]of months){const v=val(r,col);if(typeof v==='number'&&v){r_+=v;custo[m]=(custo[m]||0)+v}}
    let code=String(c).trim(),k=2;const base=code;while(itens.some(i=>i.c===code))code=base+'#'+(k++);
    if(code!==base)audit.push(`Linha ${r+1}: código ${base} repetido.`);
    itens.push({c:code,d:String(d??'').trim(),g,v:Math.round(e*100)/100,r:Math.round(r_*100)/100});
    const fx=cell(r,5)?.f;if(fx){const mm=fx.match(/-\s*([A-Z]+)\d+/);if(mm){const col=X.utils.decode_col(mm[1]);const tf=cell(r,col)?.f;if(!tf)audit.push(`Linha ${r+1} (${code}): coluna de acumulado sem fórmula; valores mensais deste serviço não seriam totalizados na planilha.`);
       else{const rm=tf.match(/:([A-Z]+)\d+/);if(rm){const lim=X.utils.decode_col(rm[1]);const fora=months.filter(([mc])=>mc>lim&&mc!==col).length;if(fora&&!audit.some(a=>a.startsWith('A fórmula de acumulado')))audit.push(`A fórmula de acumulado soma somente até a coluna ${rm[1]}; ${fora} coluna(s) mensal(is) posterior(es) ficam fora do total.`)}}}}}
  }
  if(!best||itens.length>best.itens.length){
   const label=re=>{for(let r=0;r<head;r++)for(let c=0;c<12;c++){const v=val(r,c);if(typeof v==='string'&&re.test(v))return String(val(r+1,c)??'').trim()}return''};
   let errs=[];for(const k in ws){if(k[0]!=='!'&&ws[k].t==='e')errs.push(k)}
   if(errs.length)audit.push(`${errs.length} célula(s) com erro na aba "${name}": ${errs.slice(0,8).join(', ')}.`);
   const outras=wb.SheetNames.filter(n=>n!==name&&Object.values(wb.Sheets[n]).some(x=>x&&x.t==='e'));if(outras.length)audit.push(`Abas com células em erro (#REF!): ${outras.join(', ')}.`);
   const dir=itens.reduce((s,i)=>s+i.v,0),real=itens.reduce((s,i)=>s+i.r,0);
   itens.filter(i=>i.r>i.v+0.01).forEach(i=>audit.push(`Serviço ${i.c} (${i.d}): realizado ${money(i.r)} supera o orçado ${money(i.v)} em ${money(i.r-i.v)}.`));
   if(totalBDI&&dir&&totalBDI>dir*1.001&&real){for(let r=end;r<=Math.min(rg.e.r,end+6);r++){const f=cell(r,6)?.f;if(f&&/\/\$?F\$?\d+/.test(f)){audit.push(`A linha de percentual mensal divide custo sem BDI pelo valor total com BDI: ${pct(real/totalBDI*100)} em vez de ${pct(real/dir*100)} sobre o custo direto.`);break}}}
   if(/realizado/i.test(String(val(head,5)??''))&&Object.keys(ws).some(k=>/^F\d+$/.test(k)&&/^E\d+-[A-Z]+\d+$/.test(ws[k].f||'')))audit.push('A coluna F está intitulada "Custo Total Realizado", mas a fórmula calcula o saldo a realizar (orçado menos acumulado).');
   const ult=Object.keys(custo).sort().at(-1);if(ult){const vazios=months.filter(([,m])=>m>ult).map(x=>x[1]);if(vazios.length)audit.push(`Não há custo lançado de ${br(vazios[0])} a ${br(vazios.at(-1))}, embora as colunas existam. Confirmar se a planilha está atualizada.`)}
   const f2=itens.filter(i=>/^funda.*estaqueamento/i.test(i.d));if(f2.length>1)audit.push(`Descrição repetida "${f2[0].d}" nos itens ${f2.map(i=>i.c).join(' e ')}; conferir se um deles corresponde a blocos e baldrames.`);
   for(const gg of grupos)if(!itens.some(i=>i.g===gg.n))audit.push(`Grupo ${gg.n} sem serviços orçados.`);
   best={nome:label(/^\s*empreendimento/i),municipio:label(/^\s*munic/i),construtora:label(/^\s*construtora/i),rt:label(/^\s*respons/i),itens,grupos,custoMensal:custo,valorTotal:Math.round(totalBDI*100)/100,bdi:totalBDI&&dir?Math.round((totalBDI/dir-1)*1e4)/100:0,auditoria:audit,aba:name,direto:dir,realizado:real}}
 }
 if(!best||!best.itens.length)throw new Error('Não localizei a estrutura da PLS (coluna "Nº do Item", código na coluna C e custo na coluna E).');return best}
/* ===== interface ===== */
const FAR={v:['Verde','●'],a:['Amarelo','▲'],r:['Vermelho','■']};

function tbl(head,rows,opt={}){if(!rows.length)return `<p class="empty">${opt.empty||'Nenhum registro.'}</p>`;
 return `<div class="tw"><table><thead><tr>${head.map(h=>`<th class="${h[1]||''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${head[i][1]||''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>${opt.foot?`<tfoot><tr>${opt.foot.map((c,i)=>`<td class="${head[i][1]||''}">${c}</td>`).join('')}</tr></tfoot>`:''}</table></div>`}

const field=(n,l,v,type='text',extra='')=>type==='check'?`<label class="chk"><input type="checkbox" name="${n}" ${v?'checked':''}>${l}</label>`:

 type==='sel'?`<label>${l}<select name="${n}">${extra.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`}).join('')}</select></label>`:
 `<label>${l}<input name="${n}" type="${type==='num'?'text':type}" ${type==='num'?'inputmode="decimal"':''} value="${esc(type==='num'&&typeof v==='number'?String(v).replace('.',','):v)}" ${extra}></label>`;

/* ---------- gráficos ---------- */
function lineChart(series,labels,{h=250,suf='%'}={}){const W=760,L=46,R=14,T=12,B=30;const all=series.flatMap(s=>s.v).filter(v=>v!=null);
 if(!all.length||!labels.length)return '<p class="empty">Sem dados suficientes para o gráfico.</p>';
 let max=Math.max(0,...all)*1.08||1;const piso=Math.min(0,...all),amp=max-piso;const pot=10**Math.floor(Math.log10(amp/5||1));const step=[.5,1,2,5,10,20,25,50].find(s=>amp/s<=5)||[1,2,2.5,5,10].map(k=>k*pot).find(s=>amp/s<=5)||Math.ceil(amp/5);max=Math.ceil(max/step)*step;const min=Math.floor(piso*1.08/step)*step;
 const x=i=>L+(labels.length<2?(W-L-R)/2:i*(W-L-R)/(labels.length-1)),y=v=>T+(h-T-B)*(max-v)/(max-min);let s='';
 for(let g=min;g<=max+1e-9;g+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" class="grid"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end">${qt(g)}${suf}</text>`;
 const ev=Math.ceil(labels.length/9);labels.forEach((l,i)=>{if(i%ev===0)s+=`<text x="${x(i)}" y="${h-10}" text-anchor="middle">${esc(l)}</text>`});
 series.forEach(se=>{let d='',pen=false;se.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+' '+y(v);pen=true});s+=`<path d="${d}" fill="none" stroke="var(${se.c})" stroke-width="2" ${se.dash?'stroke-dasharray="6 4"':''}/>`;
  se.v.forEach((v,i)=>{if(v!=null&&(labels.length<20||i===se.v.length-1||se.v[i+1]==null))s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(${se.c})" stroke="var(--surface)" stroke-width="2"/>`})});
 labels.forEach((l,i)=>{const w=(W-L-R)/Math.max(1,labels.length-1);s+=`<rect x="${x(i)-w/2}" y="${T}" width="${w}" height="${h-T-B}" fill="transparent"><title>${esc(l)}\n${series.map(se=>se.n+': '+(se.v[i]==null?'—':qt(se.v[i])+suf)).join('\n')}</title></rect>`});
 return `<div class="legend">${series.map(se=>`<span><i style="background:var(${se.c})"></i>${se.n}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${series.map(s=>s.n).join(', ')}">${s}</svg>`}
function curva(o,ref){const set=new Set([...Object.keys(o.baseline),...Object.keys(o.custoMensal),...o.semanas.map(s=>s.inicio.slice(0,7))]);
 let k=[...set].sort();if(!k.length)return{k:[],prev:[],fis:[],fin:[]};
 const all=[];let m=k[0];while(m<=k.at(-1)&&all.length<120){all.push(m);m=addDays(monthEnd(m),1).slice(0,7)}
 const i0=all.findIndex(m=>(o.custoMensal[m]||0)>0&&o.custoMensal[m]>direto(o)*.002);const ms=all.slice(Object.keys(o.baseline).length||o.semanas.length?0:Math.max(0,i0-2)).slice(-48);const dir=direto(o)||1;
 const temFis=o.semanas.length||o.itens.some(i=>i.p!=null);const primeiro=[...o.semanas.map(s=>s.inicio),...o.itens.filter(i=>i.dp).map(i=>i.dp)].sort()[0]?.slice(0,7);
 const bk=Object.keys(o.baseline).sort();return{k:ms,prev:ms.map(m=>bk.length&&m>=bk[0]&&m<=bk.at(-1)?previsto(o,monthEnd(m)):null),fis:ms.map(m=>temFis&&m<=ref.slice(0,7)&&m>=(primeiro||'')?fisico(o,m===ref.slice(0,7)?ref:monthEnd(m)):null),
  fin:ms.map(m=>m<=ref.slice(0,7)&&Object.keys(o.custoMensal).concat(o.pedidos.map(p=>(p.recebido||'').slice(0,7))).some(x=>x>=m)?custoReal(o,m===ref.slice(0,7)?ref:monthEnd(m))/dir*100:null)}}
function curvaHTML(o,ref){const c=curva(o,ref);const lab=c.k.map(m=>m.slice(5)+'/'+m.slice(2,4));
 return lineChart([{n:'Previsto (linha de base)',v:c.prev,c:'--s1',dash:true},{n:'Físico medido',v:c.fis,c:'--s3'},{n:'Custo realizado / custo direto',v:c.fin,c:'--s2'}],lab)+
 `<details><summary>Ver tabela da curva</summary>${tbl([['Mês'],['Previsto','r'],['Físico','r'],['Custo','r']],c.k.map((m,i)=>[br(m),pct(c.prev[i]),pct(c.fis[i]),pct(c.fin[i])]))}</details>`}

const BDIF=[['ac','AC — Administração central',4,'3,00 · 4,00 · 5,50'],['sg','S + G — Seguros e garantias',0.8,'0,80 · 0,80 · 1,00'],['r','R — Riscos',1.27,'0,97 · 1,27 · 1,27'],['df','DF — Despesas financeiras',1.23,'0,59 · 1,23 · 1,39'],['l','L — Lucro',7.4,'6,16 · 7,40 · 8,96'],['pis','PIS',0.65,'regime cumulativo'],['cofins','Cofins',3,'regime cumulativo'],['iss','ISS efetivo sobre o preço',3,'lei do município da obra'],['cprb','CPRB (só empresa/obra optante)',0,'2,70 em 2026']];
let BV=Object.fromEntries(BDIF.map(f=>[f[0],f[2]]));
function calcBDI(v){const p=k=>(v[k]||0)/100,t=p('pis')+p('cofins')+p('iss')+p('cprb');
 if(BDIF.some(f=>(v[f[0]]||0)<0)||t>=1)return null;return((1+p('ac')+p('sg')+p('r'))*(1+p('df'))*(1+p('l'))/(1-t)-1)*100}
function bdiRes(){const b=calcBDI(BV),base=BV.base||0,novo=S.ref>='2027-01-01';if(b==null)return '<p class="warn">Percentuais inválidos: não pode haver valor negativo e a soma dos tributos deve ser inferior a 100%.</p>';
 const pos=b<20.34?'abaixo do 1º quartil':b>25?'acima do 3º quartil':'entre o 1º e o 3º quartil';
 return `${novo?'<p class="warn">Data de referência em 2027 ou posterior: esta fórmula, com PIS e Cofins, não deve ser usada. Aplicação à obra bloqueada.</p>':''}<div class="kpis">${kpi('BDI calculado',pct(b),pos+' (edifícios: 20,34% a 25,00%)')}${base?kpi('Preço com BDI',money(base*(1+b/100)),'custo direto '+money(base))+kpi('Parcela do BDI',money(base*b/100)):''}</div>`}
function vBDI(){const o=O();return `<h2>BDI <small>Bonificação e Despesas Indiretas · tributos vigentes até 31/12/2026</small></h2>
 <section><h3>Calculadora</h3><p class="hint">Percentuais em %. Sob cada campo: 1º quartil · médio · 3º quartil para construção de edifícios. Os valores iniciais são os médios; ISS de 3% é apenas exemplo.</p>
 <div class="fg">${BDIF.map(f=>`<label>${f[1]}<input data-bdi="${f[0]}" inputmode="decimal" value="${String(BV[f[0]]).replace('.',',')}"><small>${f[3]}</small></label>`).join('')}<label>Custo direto (R$, opcional)<input data-bdi="base" inputmode="decimal" value="${BV.base?String(BV.base).replace('.',','):''}"></label></div>
 <p><code>BDI = [(1 + AC + S + R + G) × (1 + DF) × (1 + L) ÷ (1 − T)] − 1</code> &nbsp; T = PIS + Cofins + ISS + CPRB</p><div id="bdiRes">${bdiRes()}</div>
 ${o?`<button class="btn" data-act="aplicaBDI">Aplicar à obra: ${esc(o.nome)}</button>${o.valorTotal>0?'<p class="hint">Esta obra tem valor total com BDI informado, que prevalece nos cálculos. O BDI aplicado fica registrado, mas só altera valores se o valor total for zerado no cadastro.</p>':''}`:'<p class="hint">Cadastre uma obra para aplicar o percentual.</p>'}</section>
 <section><h3>Regras</h3>
 <h4>Alcance</h4><p>O Acórdão 2622/2013-TCU-Plenário é referência para orçamentos e auditorias de obras públicas com recursos federais. Em obra privada ou incorporação, vale como parâmetro técnico, e não como limite obrigatório.</p>
 <h4>Composição mínima (Decreto 7.983/2013, art. 9º, incisos I a IV)</h4><p>Rateio da administração central; tributos incidentes sobre o preço, excluídos os de natureza direta e personalística; risco, seguro e garantia; lucro.</p>
 <h4>Faixas de BDI total</h4>${tbl([['Tipo'],['1º quartil','r'],['Médio','r'],['3º quartil','r']],[['Construção de edifícios','20,34%','22,12%','25,00%'],['Rodovias e ferrovias','19,60%','20,97%','24,23%'],['Redes de água, esgoto e correlatas','20,76%','24,18%','26,44%'],['Fornecimento de materiais e equipamentos (diferenciado)','11,10%','14,02%','16,80%']])}
 <p class="hint">As faixas de cada componente exibidas na calculadora referem-se somente a edifícios. O BDI total estatístico não resulta da simples aplicação dos componentes médios.</p>
 <h4>O que não entra</h4><p>IRPJ e CSLL não compõem o BDI do orçamento de referência (Súmula 254/TCU; Decreto 7.983/2013, art. 9º, II). Há entendimento de que a vedação não alcança, por si só, a proposta do licitante [VERIFICAR FONTE OFICIAL]. Administração local, canteiro, mobilização e desmobilização devem figurar no custo direto.</p>
 <h4>Materiais e equipamentos relevantes</h4><p>Inviável o parcelamento, itens especializados de peso significativo no preço global recebem BDI reduzido (art. 9º, § 1º; Súmula 253/TCU), ressalvada a hipótese do § 2º.</p>
 <h4>CPRB (Lei 12.546/2011, arts. 7º, IV, 9º, § 16, e 9º-A, com a Lei 14.973/2024)</h4><p>Na construção alcançada pelo regime, a opção observa a regra da obra e é irretratável até o encerramento. Em 2026: 2,70% sobre a receita bruta, somados a 50% da contribuição patronal sobre a folha (10%), que deve estar nos encargos do custo direto, sem incidência sobre o 13º salário nessa substituição parcial. Em 2027: 1,80% e 15%. A partir de 2028: folha integral.</p>
 <h4>Transição para 2027</h4><p>PIS e Cofins são substituídos pela CBS, calculada por fora; o ISS segue na transição. O TCU calculou a alíquota de referência da CBS em 11,3% (Acórdão 2933/2026), pendente de resolução do Senado. A construção civil tem redutor (LC 214/2025, art. 261). Orçamentos e contratos com execução em 2027 exigem nova composição, sobre custos líquidos dos tributos recuperáveis, e revisão da cláusula de reequilíbrio.</p>
 <p class="hint">Base de consulta (25/11/2026): <a href="https://buscadorsinapi.com.br/calculadora-bdi" target="_blank" rel="noopener">calculadora do Buscador SINAPI</a>, com os ajustes de S+G unificados e faixas conferidas em fontes secundárias; conferir o inteiro teor do acórdão antes de uso em licitação.</p></section>`}

 const ac=it.reduce((s,i)=>s+(i.r||0),0)+o.pedidos.filter(x=>x.grupo===g.n&&x.status==='Recebido'&&x.recebido<=ref).reduce((s,x)=>s+pedidoValor(x),0);
 const va=f==null?null:v*f/100,idc=va>0&&ac>0?va/ac:null;return{g,v,f,p,ac,va,idc,idp:f!=null&&p>0?f/p:null,ept:idc?ac+(v-va)/idc:null}})}

 let ap=0,ar=0;return Object.keys(M).sort().map(k=>{const x=M[k];ap+=x.rp-x.dp;ar+=x.rr-x.dr;return{m:k,...x,ap,ar}})}

 add('Averbação da construção no Registro de Imóveis',r.averbData?'v':hab?'a':null,r.averbData?br(r.averbData):hab?'Pendente após o habite-se':'Aguarda conclusão da obra',temIncorp(o)?'Lei nº 4.591/1964, art. 44':'Registro de Imóveis competente');

function leCrono(o,txt){const L=txt.split('\n').map(s=>s.replace(/\r/g,'')).filter(s=>s.trim());if(!L.length)return{};if(L.length<2)throw new Error('Informe o cabeçalho com os meses e ao menos um grupo.');const sep=L[0].includes('\t')?'\t':';';
 const M=L[0].split(sep).slice(1).map(s=>{const m=s.trim().match(/^(\d{1,2})\/(\d{4})$/);if(!m||+m[1]<1||+m[1]>12)throw new Error('Mês inválido no cabeçalho: '+s);return m[2]+'-'+m[1].padStart(2,'0')});
 if(M.some((m,i)=>i&&m<=M[i-1]))throw new Error('Os meses devem estar em ordem crescente, sem repetição.');const out={};
 for(const l of L.slice(1)){const c=l.split(sep),g=+c[0].trim();if(!o.grupos.some(x=>x.n===g))throw new Error('Grupo inexistente no orçamento: '+c[0]);let ant=0;const r={};M.forEach((m,i)=>{const s=(c[i+1]||'').trim();if(!s)return;const v=num(s);if(!/^[\d.,]+\s*%?$/.test(s)||v>100||v<ant)throw new Error(`Grupo ${g}, ${br(m)}: percentual acumulado inválido ou decrescente.`);r[m]=ant=v});if(Object.keys(r).length)out[g]=r}return out}

<h4>Critérios do relatório gerencial enviado (consultoria)</h4><p>Contratação: verde se mantida ou adiantada; amarelo com atraso de até 3 meses; vermelho acima disso. Plano de negócios e vendas: verde sem defasagem; amarelo abaixo de 4 meses; vermelho a partir de 4 meses (o relatório não define o caso de exatos 4 meses).</p>
<h4>Regularização da obra</h4><p>Prazos e bases exibidos na aba Regularização: CNO em 30 dias do início (IN RFB nº 2.061/2021, art. 18); registro da incorporação antes da alienação (Lei nº 4.591/1964, art. 32); demonstrativo trimestral na afetação (art. 31-D, IV); averbação após o habite-se (art. 44); aferição pelo Sero e DCTFWeb (IN RFB nº 2.021/2021); CND para averbação (Lei nº 8.212/1991, art. 47, II), com a divergência local indicada na própria aba. A validade de 180 dias da certidão é estimativa a conferir no documento. Confirmar a redação vigente em fonte oficial.</p>
<h4>Simulador de aferição (SERO)</h4><p>Motor, série VAU (06/2021 a 11/2026, extraída em 01/11/2026) e exemplos são os do simulador Regulariza-obras, incorporados sem alteração de cálculo. Simulação sem valor fiscal.</p>
<h4>Planejamento e suprimentos (critérios gerenciais)</h4><p>Curva ABC: A até 80% do custo direto acumulado, B até 95%, C o restante. IDC: valor agregado ÷ custo real. Cotação: escolha diversa do menor preço exige justificativa.</p>
<h4>Parâmetros gerenciais do sistema (não são regra da Caixa)</h4><p>Farol de execução pelo IDP (físico ÷ previsto), ajustável por obra: verde a partir de 0,95; amarelo a partir de 0,85. Alertas de vencimento com 60 dias; cobertura de estoque inferior a 2 semanas pela média das últimas 4. Previsto interpolado linearmente entre os fins de mês da linha de base. Físico ponderado pelo custo direto de cada serviço.</p></section>`;
