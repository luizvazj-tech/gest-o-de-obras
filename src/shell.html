<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Obras — padrão Caixa</title>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--surface:#fff;--ink:#15181d;--mut:#5d6572;--line:#dde0e6;--acc:#17508f;--on:#fff;--s1:#257de0;--s2:#f47230;--s3:#00a37f;--ok:#0a6b1c;--warn:#855800;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;--bg:#101216;--surface:#191c22;--ink:#eceef2;--mut:#a2a9b5;--line:#30353e;--acc:#7fb2ee;--on:#0b1420;--s1:#338ced;--s2:#e76624;--s3:#00a888;--ok:#5fd07a;--warn:#e8b44a;--bad:#ff8a80}}
:root[data-theme=dark]{color-scheme:dark;--bg:#101216;--surface:#191c22;--ink:#eceef2;--mut:#a2a9b5;--line:#30353e;--acc:#7fb2ee;--on:#0b1420;--s1:#338ced;--s2:#e76624;--s3:#00a888;--ok:#5fd07a;--warn:#e8b44a;--bad:#ff8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--surface);border-bottom:3px solid var(--acc);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0}header h1 small{display:block;font-weight:400;color:var(--mut);font-size:11px}
header nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}header nav a{padding:6px 12px;border-radius:6px;color:var(--ink);text-decoration:none}header nav a.on{background:var(--acc);color:var(--on)}
main{padding:18px 20px 60px;max-width:1360px;margin:auto}h2{font-size:20px;margin:0 0 12px}h2 small{font-size:12px;color:var(--mut);font-weight:400}h3{font-size:15px;margin:0 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}h4{margin:18px 0 8px}
section,article,.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;min-width:0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px}@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:14px}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}.kpi span,.kpi small{display:block;color:var(--mut);font-size:12px}.kpi strong{font-size:21px;display:block;margin:3px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em}.r{text-align:right;font-variant-numeric:tabular-nums}tfoot td{font-weight:700}td small{display:block;color:var(--mut)}td input{width:100px;text-align:right}
a{color:var(--acc)}.neg{color:var(--bad);font-weight:600}.far{white-space:nowrap;font-size:12px;font-weight:600;color:var(--mut)}.f-v{color:var(--ok)}.f-a{color:var(--warn)}.f-r{color:var(--bad)}
.meter{display:block;position:relative;width:150px;height:10px;background:var(--line);border-radius:5px}.meter i{position:absolute;inset:0 auto 0 0;background:var(--s3);border-radius:5px}.meter b{position:absolute;top:-3px;width:2px;height:16px;background:var(--s1)}
.al{border-left:4px solid var(--warn);padding:6px 10px;margin-bottom:6px;background:var(--bg)}.al-r{border-color:var(--bad)}.al b{font-size:12px}.al-r b{color:var(--bad)}.al-a b{color:var(--warn)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;align-items:end;margin-bottom:10px}label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}label.wide{grid-column:1/-1}label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}textarea{width:100%}
.btn{display:inline-block;font:inherit;background:var(--acc);color:var(--on);border:1px solid var(--acc);border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;justify-self:start}.btn.sec{background:transparent;color:var(--acc)}.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}label.btn{color:var(--acc)}
.lk{background:none;border:0;color:var(--acc);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.head select{font-size:17px;font-weight:600}.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--mut);font:inherit}.tabs button.on{border-color:var(--acc);color:var(--ink);font-weight:600}
.hint,.empty{color:var(--mut);font-size:12px}.pre{white-space:pre-wrap}.warn{border:1px solid var(--bad);padding:8px;border-radius:6px}.assin{margin-top:40px;color:var(--mut)}
svg{width:100%;height:auto;max-width:900px}svg text{font-size:11px;fill:var(--mut)}.grid{stroke:var(--line)}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:14px;height:4px;margin-right:5px;vertical-align:middle}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;max-width:420px;z-index:20}#toast.show{opacity:1}#toast.bad{background:var(--bad);color:var(--surface)}
#serobox[hidden]{display:none}#serobox{margin:-60px auto 40px;max-width:1240px;border-radius:10px}main+#serobox:not([hidden]){margin-top:-56px}.gantt td,.gantt th{padding:3px 5px;text-align:center;font-size:11px;border:1px solid var(--line)}.gantt td:first-child,.gantt th:first-child{text-align:left;min-width:190px}.gantt td.g{background:color-mix(in srgb,var(--s1) 30%,transparent)}.gantt th.hoje{border-bottom:3px solid var(--acc)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:10px}.fotos figure{margin:0}.fotos img{width:100%;border-radius:6px;display:block}.fotos figcaption{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header><h1>Gestão de Obras<small id="modo">carregando…</small></h1>
<nav><a href="#painel">Painel</a><a href="#obra">Obras</a><a href="#tarefas">Pendências</a><a href="#regularizacao">Regularização e SERO</a><a href="#relatorios">Relatórios</a><a href="#bdi">BDI</a><a href="#importar">Importar e backup</a><a href="#criterios">Critérios Caixa</a></nav>
<label>Data de referência<input type="date" id="ref"></label></header>
<main id="app"><p class="empty">Carregando dados…</p></main><div id="serobox" hidden></div><!--SERO_TPL--><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</body></html>
